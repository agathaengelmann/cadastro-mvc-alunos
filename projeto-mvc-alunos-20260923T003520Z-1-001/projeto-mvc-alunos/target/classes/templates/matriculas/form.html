<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Matrícula</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container estreito">
    <header class="topo">
        <div>
            <h1>Nova Matrícula</h1>
            <p>Selecione o aluno e o curso.</p>
        </div>
    </header>

    <section class="card">
        <p class="erro" th:if="${erro != null}" th:text="${erro}"></p>

        <form th:action="@{/matriculas}" th:object="${matricula}" method="post" class="formulario">
            <label for="aluno">Aluno</label>
            <select id="aluno" th:field="*{aluno}" required>
                <option value="">Selecione o Aluno...</option>
                <option th:each="a : ${alunos}" th:value="${a.id}" th:text="${a.nome}"></option>
            </select>

            <label for="curso">Curso</label>
            <select id="curso" th:field="*{curso}" required>
                <option value="">Selecione o Curso...</option>
                <option th:each="c : ${cursos}" th:value="${c.id}" th:text="${c.nome}"></option>
            </select>

            <div class="acoes-formulario">
                <a class="botao secundario" th:href="@{/matriculas}">Cancelar</a>
                <button class="botao" type="submit">Matricular</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
