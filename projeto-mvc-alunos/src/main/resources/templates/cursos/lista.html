<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cursos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <header class="topo">
        <div>
            <h1>Cadastro de Cursos</h1>
            <p>Exemplo didático de MVC com Java e Spring Boot</p>
        </div>
        <a class="botao" th:href="@{/cursos/novo}">Novo curso</a>
    </header>

    <section class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Carga Horária</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="curso : ${cursos}">
                <td th:text="${curso.id}">1</td>
                <td th:text="${curso.nome}">Informática para Internet</td>
                <td th:text="${curso.descricao}">Curso técnico de nível médio</td>
                <td th:text="${curso.cargaHoraria}">1200</td>
                <td class="acoes">
                    <a class="botao secundario" th:href="@{/cursos/editar/{id}(id=${curso.id})}">Editar</a>

                    <form th:action="@{/cursos/excluir/{id}(id=${curso.id})}" method="post">
                        <button class="botao perigo" type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <p class="vazio" th:if="${#lists.isEmpty(cursos)}">Nenhum curso cadastrado.</p>
    </section>
</main>
</body>
</html>
