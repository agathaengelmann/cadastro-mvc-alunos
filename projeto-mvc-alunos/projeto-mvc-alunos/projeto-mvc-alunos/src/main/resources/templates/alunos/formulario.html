<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluno</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container estreito">
    <header class="topo">
        <div>
            <h1 th:text="${aluno.id == null ? 'Novo aluno' : 'Editar aluno'}">Novo aluno</h1>
            <p>Preencha os dados abaixo.</p>
        </div>
    </header>

    <section class="card">
        <form th:action="@{/alunos/salvar}" th:object="${aluno}" method="post" class="formulario">
            <input type="hidden" th:field="*{id}">

            <label for="nome">Nome</label>
            <input id="nome" type="text" th:field="*{nome}" required>

            <label for="rg">RG</label>
            <input id="rg" type="text" th:field="*{rg}" required>

            <label for="email">E-mail</label>
            <input id="email" type="email" th:field="*{email}" required>

            <label for="curso">Curso</label>
            <input id="curso" type="text" th:field="*{curso}" required>

            <div class="acoes-formulario">
                <a class="botao secundario" th:href="@{/alunos}">Cancelar</a>
                <button class="botao" type="submit">Salvar</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
