<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <header class="topo">
        <div>
            <h1>Cadastro de Alunos</h1>
            <p>Exemplo didático de MVC com Java e Spring Boot</p>
        </div>
        <a class="botao" th:href="@{/alunos/novo}">Novo aluno</a>
    </header>

    <section class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>RG</th>
                <th>E-mail</th>
                <th>Curso</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="aluno : ${alunos}">
                <td th:text="${aluno.id}">1</td>
                <td th:text="${aluno.nome}">Ana Souza</td>
                <td th:text="${aluno.rg}">256398566</td>
                <td th:text="${aluno.email}">ana@email.com</td>
                <td th:text="${aluno.curso}">Informática para Internet</td>
                <td class="acoes">
                    <a class="botao secundario" th:href="@{/alunos/editar/{id}(id=${aluno.id})}">Editar</a>

                    <form th:action="@{/alunos/excluir/{id}(id=${aluno.id})}" method="post">
                        <button class="botao perigo" type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <p class="vazio" th:if="${#lists.isEmpty(alunos)}">Nenhum aluno cadastrado.</p>
    </section>
</main>
</body>
</html>
