<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Matrícula</title>
</head>
<body>
<h1>Cadastrar Matrícula</h1>

<!-- Exibe a mensagem de erro caso tente duplicar uma matrícula ativa -->
<div th:if="${erro != null}" style="color: red; margin-bottom: 15px;">
    <p th:text="${erro}"></p>
</div>

<form th:action="@{/matriculas}" th:object="${matricula}" method="post">

    <div>
        <label for="aluno">Aluno:</label>
        <select id="aluno" th:field="*{aluno}" required>
            <option value="">Selecione o Aluno...</option>
            <option th:each="a : ${alunos}" th:value="${a.id}" th:text="${a.nome}"></option>
        </select>
    </div>
    <br>

    <div>
        <label for="curso">Curso:</label>
        <select id="curso" th:field="*{curso}" required>
            <option value="">Selecione o Curso...</option>
            <!-- Ajuste a.nome para a.titulo dependendo de como está na sua classe Curso -->
            <option th:each="c : ${cursos}" th:value="${c.id}" th:text="${c.nome}"></option>
        </select>
    </div>
    <br>

    <button type="submit">Matricular</button>
    <a th:href="@{/matriculas}">Cancelar</a>
</form>
</body>
</html>
